name: Harness CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate syntax
        run: |
          bash -n bootstrap.sh
          bash -n bin/agent-harness
          bash -n bin/agent-memory
          bash -n scripts/test-harness.sh
          bash -n scripts/test-orchestrator.sh
          bash -n scripts/setup/install-ponytail.sh
          bash -n scripts/setup/install-chatgpt-web.sh
          bash -n scripts/setup/chatgpt-web-control.sh
          bash -n scripts/setup/install-agentmemory.sh
          bash -n scripts/setup/agentmemory-service.sh
          bash -n templates/scripts/agents/create-worktree.sh
          node --check scripts/orchestrate.mjs
          node --check scripts/orchestrator/core.mjs
          node --check scripts/orchestrator/executor.mjs
          node --check scripts/orchestrator/lifecycle.mjs
          node --check scripts/orchestrator/run.mjs

      - name: Run harness smoke test
        run: ./scripts/test-harness.sh

      - name: Run orchestrator smoke test
        run: bash scripts/test-orchestrator.sh
