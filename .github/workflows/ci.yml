name: Harness CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate syntax
        run: |
          bash -n bootstrap.sh
          bash -n bin/agent-harness
          bash -n bin/agent-memory
          bash -n scripts/test-harness.sh
          bash -n scripts/setup/install-ponytail.sh
          python3 -m py_compile scripts/route_agent.py scripts/test_route_agent.py
          bash -n scripts/setup/install-agentmemory.sh
          bash -n scripts/setup/agentmemory-service.sh
          bash -n scripts/setup/orca-control.sh
          bash -n scripts/setup/orca-skill-updates.sh

      - name: Run harness smoke test
        run: ./scripts/test-harness.sh
